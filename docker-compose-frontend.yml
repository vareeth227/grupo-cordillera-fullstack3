version: '3.8'

# Docker Compose para el frontend React del dashboard Grupo Cordillera

services:
  # Frontend React - Dashboard ejecutivo en tiempo real
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-cordillera
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    networks:
      - cordillera-net
    depends_on:
      - api-gateway
    restart: unless-stopped

networks:
  cordillera-net:
    external: true
    name: cordillera-net
